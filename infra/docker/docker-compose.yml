name: shipfun
services:
  api:
    build: {context: ../.., dockerfile: infra/docker/api.Dockerfile}
    environment:
      SHIPFUN_ENVIRONMENT: ${SHIPFUN_ENVIRONMENT:-mainnet}
      SHIPFUN_NETWORK: ${SHIPFUN_NETWORK:-mainnet}
      SHIPFUN_API_HOST: 0.0.0.0
      SHIPFUN_API_PORT: 3000
    restart: unless-stopped
    expose: ["3000"]
  web:
    build: {context: ../.., dockerfile: infra/docker/web.Dockerfile}
    restart: unless-stopped
    expose: ["80"]
